<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Optibelt Display</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        .swiper { width: 100vw; height: 100vh; }
        .swiper-slide { display: flex; justify-content: center; align-items: center; background: black; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }
        
        /* Flechas de navegación (Por defecto ocultas, Swiper las maneja) */
        .swiper-button-next, .swiper-button-prev { color: white; opacity: 0.5; }
        .swiper-button-next:hover, .swiper-button-prev:hover { opacity: 1; }

        /* ... (Estilos de menú y video iguales) ... */
    </style>
</head>
<body>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="slides-container"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const myFolder = params.get('folder') || 'General';
        let swiper;

        socket.on('refresh_' + myFolder, () => { loadContent(); });
        window.onload = loadContent;

        async function loadContent() {
            try {
                const res = await fetch(`/api/tv-content?folder=${myFolder}`);
                const data = await res.json();

                // 1. Renderizar Imágenes
                const container = document.getElementById('slides-container');
                container.innerHTML = '';
                
                // Si la ruta viene con backslash (error viejo), la corregimos aquí también por seguridad
                const safeImages = data.images.map(url => url.replace(/\\/g, '/'));

                if(safeImages.length === 0) {
                    container.innerHTML = '<div class="swiper-slide" style="color:gray">Esperando contenido...</div>';
                } else {
                    safeImages.forEach(url => {
                        container.innerHTML += `<div class="swiper-slide"><img src="${url}"></div>`;
                    });
                }

                // 2. CONFIGURAR SWIPER (Aquí está la lógica Auto vs Manual)
                if(swiper) swiper.destroy(true, true);

                let swiperConfig = {
                    effect: "fade",
                    loop: true,
                    // Habilitar teclado (Flechas)
                    keyboard: { enabled: true },
                    // Habilitar botones en pantalla
                    navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
                    pagination: { el: ".swiper-pagination", clickable: true },
                };

                // Si el Admin activó Automático:
                if (data.isAuto) {
                    swiperConfig.autoplay = { 
                        delay: data.interval, 
                        disableOnInteraction: false 
                    };
                    // Ocultamos las flechas visualmente si es automático (opcional)
                    document.querySelector('.swiper-button-next').style.display = 'none';
                    document.querySelector('.swiper-button-prev').style.display = 'none';
                } else {
                    // Si es Manual:
                    delete swiperConfig.autoplay; // Aseguramos que no se mueva solo
                    // Mostramos flechas
                    document.querySelector('.swiper-button-next').style.display = 'block';
                    document.querySelector('.swiper-button-prev').style.display = 'block';
                }

                swiper = new Swiper(".mySwiper", swiperConfig);

                // ... (Lógica de videos igual) ...

            } catch(e) { console.error(e); }
        }
        // ... (Funciones de video) ...
    </script>
</body>
</html>
