<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optibelt TV Display</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    
    <style>
        /* Estilos Generales: Pantalla completa, fondo negro, sin cursor */
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            background: #000; 
            font-family: 'Segoe UI', sans-serif; 
            width: 100vw;
            height: 100vh;
            cursor: none; /* Oculta el mouse para que se vea pro */
        }

        .view-section { display: none; min-height: 100vh; height: 100vh; width: 100vw; }

        /* --- Estilos del Carrusel (Galería) --- */
        .swiper { width: 100%; height: 100%; }
        .swiper-slide { background: #000; display: flex; justify-content: center; align-items: center; }
        
        .swiper-slide img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* Ajusta la imagen sin deformarla */
            image-rendering: -webkit-optimize-contrast; 
        }

        /* Flechas de navegación (solo visibles si no es automático) */
        .swiper-button-next, .swiper-button-prev { color: white; transform: scale(1.5); text-shadow: 0 0 5px black; }
        .modo-auto .swiper-button-next, .modo-auto .swiper-button-prev { display: none !important; }

        /* --- Estilos del Video Principal --- */
        #vista-video { display: flex; justify-content: center; align-items: center; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Etiqueta pequeña con el ID de la pantalla (abajo derecha) */
        #id-pantalla { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            color: rgba(255,255,255,0.2); 
            font-size: 18px; 
            z-index: 999; 
            font-weight: bold;
            text-transform: uppercase;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="vista-galeria" class="view-section">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="galeria-contenido">
                </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <div id="vista-video" class="view-section"></div>

    <div id="id-pantalla">Cargando ID...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script>
        // --- CONEXIÓN CON EL SERVIDOR ---
        const socket = io();
        
        // Obtener el ID de la URL (ej: tv.html?id=Reception)
        const params = new URLSearchParams(window.location.search);
        const myId = params.get('id') || 'general';
        
        // Mostrar ID en pantalla discretamente
        document.getElementById('id-pantalla').innerText = myId;

        // Al conectar, unirse al "Cuarto" (Room) específico
        socket.on('connect', () => {
            console.log(`Conectado al servidor. ID: ${myId}`);
            socket.emit('join', myId);
        });

        let swiper; // Variable para guardar la instancia del carrusel

        // --- RECIBIR CONTENIDO NUEVO ---
        socket.on('contentUpdate', (payload) => {
            // Doble verificación: Solo procesar si es para MÍ o para TODOS
            if(payload.target !== 'all' && payload.target !== myId) return;

            console.log("Recibiendo contenido:", payload);
            ocultarTodo(); // Limpia la pantalla antes de mostrar lo nuevo

            // CASO A: ES UNA GALERÍA DE IMÁGENES
            if (payload.type === 'gallery') {
                const wrapper = document.getElementById('galeria-contenido');
                wrapper.innerHTML = '';
                
                // Crear las diapositivas
                payload.urls.forEach(url => {
                    wrapper.innerHTML += `<div class="swiper-slide"><img src="${url}"></div>`;
                });

                document.getElementById('vista-galeria').style.display = 'block';

                // Si ya existía un carrusel, lo destruimos para crear uno nuevo limpio
                if (swiper) swiper.destroy(true, true);
                
                const swiperContainer = document.querySelector('.mySwiper');
                let swiperOptions = {
                    effect: "fade", // Efecto desvanecimiento elegante
                    loop: true,
                    pagination: { el: ".swiper-pagination", clickable: true },
                    keyboard: { enabled: true } 
                };

                // Configurar Auto-Play si se solicitó
                if (payload.options && payload.options.autoPlay) {
                    swiperContainer.classList.add('modo-auto');
                    swiperOptions.autoplay = {
                        delay: payload.options.duration * 1000, 
                        disableOnInteraction: false 
                    };
                } else {
                    swiperContainer.classList.remove('modo-auto');
                    swiperOptions.navigation = { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" };
                }

                swiper = new Swiper(".mySwiper", swiperOptions);
            } 
            
            // CASO B: ES UN VIDEO
            else if (payload.type === 'video') {
                const container = document.getElementById('vista-video');
                container.style.display = 'flex';
                
                // Insertamos el video con Autoplay y Loop
                container.innerHTML = `
                    <video id="video-display" controls autoplay muted loop playsinline preload="auto">
                        <source src="${payload.url}" type="video/mp4">
                    </video>
                `;
                
                // Forzar play por si acaso el navegador se pone difícil
                setTimeout(() => {
                    const v = document.getElementById('video-display');
                    if(v) v.play().catch(e => console.log("Autoplay requiere interacción del usuario:", e));
                }, 100);
            }
        });

        // Función auxiliar para limpiar la vista
        function ocultarTodo() {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.getElementById('vista-video').innerHTML = ''; // Borrar video anterior para liberar memoria
        }
    </script>
</body>
</html>
