<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Optibelt Display</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        
        /* CARRUSEL IMÁGENES */
        .swiper { width: 100vw; height: 100vh; }
        .swiper-slide { display: flex; justify-content: center; align-items: center; background: black; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: contain; }

        /* BOTÓN TUTORIALES */
        #btn-tutorials {
            position: absolute; bottom: 30px; right: 30px; z-index: 100;
            background: rgba(0, 86, 179, 0.9); color: white; border: 2px solid white;
            padding: 15px 30px; border-radius: 50px; font-size: 1.5rem; cursor: pointer;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); display: none; /* Se muestra si hay videos */
        }

        /* MENÚ DE VIDEOS (Full Screen) */
        #video-menu {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 200; padding: 40px; box-sizing: border-box; overflow-y: auto;
        }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .video-card { background: #222; padding: 10px; border-radius: 10px; cursor: pointer; text-align: center; color: white; border: 1px solid #444; }
        .video-card:active { background: #0056b3; }
        
        /* REPRODUCTOR */
        #player-view { display: none; position: fixed; inset: 0; background: black; z-index: 300; }
        video { width: 100%; height: 100%; }
        #btn-close-video { position: absolute; top: 20px; left: 20px; font-size: 1.5rem; padding: 10px 20px; z-index: 301; cursor: pointer;}
    </style>
</head>
<body>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="slides-container"></div>
    </div>

    <button id="btn-tutorials" onclick="openMenu()">📺 Ver Tutoriales</button>

    <div id="video-menu">
        <h2 style="color:white; border-bottom:1px solid #555; padding-bottom:10px;">
            Seleccione Tutorial <button onclick="closeMenu()" style="float:right; font-size:1rem;">✖ Cerrar</button>
        </h2>
        <div class="video-grid" id="video-grid"></div>
    </div>

    <div id="player-view">
        <button id="btn-close-video" onclick="stopVideo()">⏹ Salir</button>
        <video id="main-video" controls></video>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const myFolder = params.get('folder') || 'General';
        let swiper;

        // Escuchar orden de recarga ESPECÍFICA para mi carpeta
        socket.on('refresh_' + myFolder, () => {
            console.log("Admin actualizó mi contenido. Recargando...");
            loadContent();
        });

        window.onload = loadContent;

        async function loadContent() {
            try {
                // Pedir SOLO mi contenido aprobado
                const res = await fetch(`/api/tv-content?folder=${myFolder}`);
                const data = await res.json();

                // 1. CONFIGURAR IMÁGENES (Automático)
                const container = document.getElementById('slides-container');
                container.innerHTML = '';
                
                if(data.images.length === 0) {
                    container.innerHTML = '<div class="swiper-slide" style="color:gray">Esperando contenido del Admin...</div>';
                } else {
                    data.images.forEach(url => {
                        container.innerHTML += `<div class="swiper-slide"><img src="${url}"></div>`;
                    });
                }

                // Reiniciar Swiper con el nuevo intervalo
                if(swiper) swiper.destroy(true, true);
                swiper = new Swiper(".mySwiper", {
                    effect: "fade", loop: true,
                    autoplay: { delay: data.interval, disableOnInteraction: false }
                });

                // 2. CONFIGURAR VIDEOS (Menú)
                const vGrid = document.getElementById('video-grid');
                vGrid.innerHTML = '';
                
                if(data.videos.length > 0) {
                    document.getElementById('btn-tutorials').style.display = 'block';
                    data.videos.forEach(url => {
                        const name = url.split('/').pop();
                        const div = document.createElement('div');
                        div.className = 'video-card';
                        div.innerHTML = `<div style="font-size:3rem">▶</div><br>${name}`;
                        div.onclick = () => playVideo(url);
                        vGrid.appendChild(div);
                    });
                } else {
                    document.getElementById('btn-tutorials').style.display = 'none';
                }

            } catch(e) { console.error(e); }
        }

        // FUNCIONES DE INTERFAZ
        function openMenu() {
            if(swiper) swiper.autoplay.stop();
            document.getElementById('video-menu').style.display = 'block';
        }
        function closeMenu() {
            document.getElementById('video-menu').style.display = 'none';
            if(swiper) swiper.autoplay.start();
        }
        function playVideo(url) {
            const v = document.getElementById('main-video');
            v.src = url;
            document.getElementById('player-view').style.display = 'block';
            v.play();
            v.onended = stopVideo;
        }
        function stopVideo() {
            const v = document.getElementById('main-video');
            v.pause();
            document.getElementById('player-view').style.display = 'none';
            closeMenu(); // Regresa al slideshow directo
        }
    </script>
</body>
</html>
